<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{padding: 0; margin: 0;}
        .wrap{display: flex; justify-content: center; align-items: center; height: 100vh;}
        h2{font-size: 28px; }

        /* response */
        @media screen and (max-width: 1800px){
            .wrap{min-width: 100%; background: yellowgreen;}
        }
        @media screen and (max-width: 1024px){
            .wrap{min-width: 100%; background: orange;}
        }
        @media screen and (max-width: 768px){
            .wrap{min-width: 100%; background: pink;}
        }
            
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h2>반응형으로 새창열기</h2>
    </div>
    
</body>
</html>
